
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Gestion  utilisateurs</title>
</head>

<body>

    <h1>Gestion des utilisateurs</h1>

    <form id="formulaire">

        <label for="idCreateur">Identifiant créateur :</label>
        <input type="text" id="idCreateur" value="MonPseudoIci"><br>

        <label for="nom">Nom :</label>
        <input type="text" id="nom"><br>

        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom"><br>

        <label for="genre">Genre :</label>
        <select id="genre">
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
            <option value="Autre">Autre</option>
        </select><br>

        <label for="dateNaissance">Date de naissance :</label>
        <input type="date" id="dateNaissance"><br>

        <label for="lieuNaissance">Lieu de naissance :</label>
        <input type="text" id="lieuNaissance"><br>

        <label for="departementNaissance">Département de naissance :</label>
        <input type="text" id="departementNaissance"><br>

        <label for="numeroRue">Numéro de rue :</label>
        <input type="number" id="numeroRue"><br>

        <label for="libelleRue">Libellé de rue :</label>
        <input type="text" id="libelleRue"><br>

        <label for="codePostal">Code postal :</label>
        <input type="text" id="codePostal"><br>

        <label for="ville">Ville :</label>
        <input type="text" id="ville"><br>

        <button type="button" onclick="envoyerUtilisateur()">Créer</button>

    </form>

    <h2>Liste des utilisateurs créés</h2>

    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Date de naissance</th>
                <th>Lieu de naissance</th>
                <th>Adresse</th>
            </tr>
        </thead>

        <tbody id="tableauUtilisateurs"></tbody>
    </table>

    <script src="tp10-formulaire.js"></script>

</body>

</html>
